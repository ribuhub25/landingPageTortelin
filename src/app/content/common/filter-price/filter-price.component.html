<mat-slider [min]="priceMin" [max]="priceMax">
  <input [(value)]="priceVarMin" matSliderStartThumb>
  <input [(value)]="priceVarMax" matSliderEndThumb>
</mat-slider>
<div class="text-center pb-3">
  Precio: <span>{{priceVarMin | currency:'S/.'}} - {{priceVarMax | currency:'S/.'}}</span>
</div>
<div class="text-center">
  <button mat-fab extended (click)="FilterTortas(priceVarMax,priceVarMin)" #btnFilterRef>FILTRAR</button>
</div>
