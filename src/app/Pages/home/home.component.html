<app-nav-bar [drawer]="drawer" [count]="count"></app-nav-bar>

<mat-drawer-container class="example-container">
  <mat-drawer #drawer class="hijo-sidenav" mode="side" position="end">
    <app-list-tortas-cart [count]="count" [tortasSeleccionados]="tortasCarrito" />
  </mat-drawer>
  <mat-drawer-content>
    <div class="card col-12 text-center">
      <div class="card-body">
        <h4>¡Las Más Pedidas!</h4>
        <p>Las preferidas por nuestros clientes</p>
        <div class="d-flex flex-columns justify-content-center gap-3">
          @for (torta of tortasTop5; track torta.id) {
            <snap-card [torta]="torta" [categoryName]="GetCategoryName(torta.categoryId)" (cardEmitter)="onGetTortaDetail(torta.id)"></snap-card>
          }
        </div>
      </div>
    </div>
  </mat-drawer-content>
</mat-drawer-container>
